<div class="card-body gap-1">
    <form class="justify-content-center" method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="nickname" class="form-label">Nickname</label>
            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Enter nickname" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email_address" placeholder="you@example.com" required>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="4" name="password" placeholder="Enter password" required>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="4" name="confirm_password" placeholder="Re-enter password" required>
            </div>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" required/>
            <label class="form-check-label" for="flexCheckDefault">Agree with terms and conditions</label>
            </div>

        <div class="card-action d-flex gap-2">
            <button type="submit" class="btn btn-success rounded-pill col">Create Account</button>
            <a href="{% url "landing-page" %}" class="btn btn-danger">Cancel</a>
        </div>
    </form>
</div>
