{% load static %}

<div class="most-popular">
    <div class="row">
        <div class="col-lg-12">
            <div class="heading-section">
                <h4>
                    <em>Most Popular</em> Right Now
                </h4>
            </div>

            <div class="row">
                {% for project in randomProjects %} 
                    <div class="col-lg-3 col-sm-6">
                        <div class="item">
                            <img src="https://res.cloudinary.com/content-storage/image/upload/v1752513474/{{project.thumbnail_image}}" alt="{{project.name}}">
                            <h4><a href="{% url "view-project" project.handle %}">{{project.name | truncatechars:20}}</a>
                                <br>
                                <span>{{project.user_username}}</span>
                            </h4>
                            <ul>
                                <li>
                                    <i class="fa fa-user"></i> {{project.view_count}}
                                </li>
                                <li>
                                    Status: 
                                    {% if project.is_verified %}
                                        <i class="fa-regular fa-circle-check"></i> 
                                    {% else %}
                                        <i class="fa-regular fa-circle-xmark"></i>
                                    {% endif %}
                                    
                                </li>
                            </ul>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class="col-lg-12">
        <div class="main-button">
            <a href="{% url "project-homepage" %}">View Populer Project</a>
        </div>
    </div>
</div>
